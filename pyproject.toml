[project]
name = "agentic-workflow-dev"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["mypy>=1.19", "ruff>=0.14", "pre-commit>=4.5"]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.11"
strict = true
files = ["agentic-workflow/helpers", "agentic-workflow/tests", "evals", "tests"]
exclude = ["__pycache__"]
mypy_path = ["agentic-workflow/helpers", "agentic-workflow/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["agentic-workflow/**/*.py", "evals/**/*.py", "tests/**/*.py", "pyproject.toml"]
extend-exclude = ["apps", ".agentic-workflow", "tmp", "temp", ".cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
