id: linux-python-uv
version: "0.1"
delivery_type: cli
language: Python
runtime: "CPython >=3.14,<3.15"
platform: Linux
required_technologies:
  - uv
  - pyproject.toml with declared dependencies and todo console entry point
  - committed uv.lock
  - Python standard library application code
forbidden_technologies:
  - third-party application runtime dependencies
allowed_implementation_choices:
  - internal module layout
  - build backend and its declared build dependencies

build_environment:
  toolchain_constraints:
    - project lives at app/ relative to repository root
    - use the locked project for future verification
  dependency_sources:
    - PyPI for declared build dependencies
  network_policy: Preparation may fetch declared dependencies; prepared task operations work offline.

# Commands run from the repository root; the check adapter resolves app absolutely.
adapter:
  reference: ../../.suite/runs/003-implement-todo-cli/checks/adapter.py
  revision: task-003-v1
  build: [uv, build, --project, app]
  prepare: [uv, sync, --locked, --project, app]
  invoke: [uv, run, --offline, --no-sync, --project, app, todo]
  cleanup: []
  unit_checks: []
  nonapplicable_operations:
    - cleanup: Acceptance fixtures are removed by the check runner; retain the prepared environment.
    - unit_checks: Black-box acceptance through the real console script is the verification boundary.

acceptance_boundary: Real todo console entry point via uv, observable process output and task-file effects.
required_assets: []
operational_environment: Linux local filesystem, one writer at a time; task-file paths resolve against caller cwd.
