[project]
name = "todolist"
version = "0.1.0"
description = "A small TODO application with JSON persistence"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
todolist = "todolist.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
