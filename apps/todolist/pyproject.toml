[project]
name = "todolist"
version = "0.1.0"
description = "A small JSON-backed todo app"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
todo = "todolist.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["todolist"]
