services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports:
      - "127.0.0.1:${TODO_DB_PORT:-5432}:5432"
    volumes:
      - todo_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 1s
      timeout: 5s
      retries: 30
volumes:
  todo_data:
